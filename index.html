
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>EPICPLYR</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #000;
}

.player-container {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    position: fixed;
    inset: 0;
    background: #000;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

.plyr {
    width: 100%;
    height: 100%;
    --plyr-color-main: #e50914;
    --plyr-video-background: #000;
    --plyr-menu-background: #151515;
    --plyr-menu-color: #fff;
    --plyr-control-radius: 5px;
}

.plyr--video .plyr__controls {
    padding: 15px 12px;
    background: linear-gradient(
        transparent,
        rgba(0,0,0,.9)
    );
}

.plyr__video-wrapper {
    height: 100%;
    background: #000;
}

.plyr__video-wrapper video {
    object-fit: contain;
}

.plyr__control--overlaid {
    background: #e50914;
}

.plyr__control--overlaid:hover {
    background: #b80710;
}

.status {
    position: absolute;
    z-index: 5;
    top: 15px;
    left: 15px;
    color: #fff;
    background: rgba(20,20,20,.8);
    border: 1px solid #333;
    padding: 7px 11px;
    border-radius: 5px;
    font: 12px Arial, sans-serif;
    pointer-events: none;
    transition: opacity .4s;
}

.status::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #e50914;
    border-radius: 50%;
    margin-right: 7px;
}

.status.hidden {
    opacity: 0;
}

@media (orientation: portrait) {
    .plyr__video-wrapper video {
        object-fit: contain;
    }
}
</style>
</head>

<body>

<div class="player-container">

    <div class="status" id="status">
        EPICPLYR · Ready
    </div>

    <video
        id="video"
        controls
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        preload="auto">
    </video>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
const video = document.getElementById("video");
const statusBox = document.getElementById("status");

let hls = null;
let player = null;
let statusTimer = null;

function setStatus(message) {
    statusBox.textContent = message;
    statusBox.classList.remove("hidden");

    clearTimeout(statusTimer);

    statusTimer = setTimeout(() => {
        statusBox.classList.add("hidden");
    }, 3500);
}

function destroyPlayer() {

    if (player) {
        player.destroy();
        player = null;
    }

    if (hls) {
        hls.destroy();
        hls = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();
}

function initializePlayer(qualityOptions = [0], isHLS = false) {

    if (player) {
        player.destroy();
        player = null;
    }

    const settings = isHLS
        ? ["quality", "speed"]
        : ["speed"];

    player = new Plyr(video, {

        autoplay: false,

        controls: [
            "play-large",
            "play",
            "progress",
            "current-time",
            "duration",
            "mute",
            "volume",
            "settings",
            "pip",
            "airplay",
            "fullscreen"
        ],

        fullscreen: {
            enabled: true,
            fallback: true,
            iosNative: true
        },

        clickToPlay: true,
        hideControls: true,
        resetOnEnd: false,

        keyboard: {
            focused: true,
            global: true
        },

        tooltips: {
            controls: true,
            seek: true
        },

        speed: {
            selected: 1,
            options: [0.5, 0.75, 1, 1.25, 1.5, 2]
        },

        quality: {
            default: 0,
            options: qualityOptions,
            forced: true,
            onChange: changeQuality
        },

        i18n: {
            qualityLabel: {
                0: "Auto"
            }
        }
    });

    player.on("playing", () => setStatus("EPICPLYR · Playing"));
    player.on("waiting", () => setStatus("EPICPLYR · Buffering"));
    player.on("error", () => setStatus("Playback error"));
    player.on("canplay", () => setStatus("EPICPLYR · Ready"));
}

function changeQuality(height) {

    if (!hls) return;

    if (height === 0) {
        hls.currentLevel = -1;
        return;
    }

    const index = hls.levels.findIndex(
        level => level.height === height
    );

    if (index !== -1) {
        hls.currentLevel = index;
    }
}

function startPlayer(streamURL) {

    let parsedURL;

    try {
        parsedURL = new URL(streamURL);

        if (!["http:", "https:"].includes(parsedURL.protocol)) {
            throw new Error("Invalid protocol");
        }

    } catch (error) {
        setStatus("Invalid video URL");
        return;
    }

    destroyPlayer();

    const isHLS = /\.m3u8$/i.test(parsedURL.pathname);

    setStatus("EPICPLYR · Connecting");

    if (isHLS) {

        if (Hls.isSupported()) {

            hls = new Hls({
                enableWorker: true,
                capLevelToPlayerSize: false,
                startLevel: -1,
                maxBufferLength: 30
            });

            hls.loadSource(parsedURL.href);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {

                const heights = [
                    ...new Set(
                        hls.levels
                            .map(level => level.height)
                            .filter(height => height > 0)
                    )
                ].sort((a, b) => a - b);

                initializePlayer([0, ...heights], true);

                setStatus("EPICPLYR · Stream ready");
            });

            hls.on(Hls.Events.ERROR, (event, data) => {

                if (!data.fatal) return;

                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {

                    setStatus("Network error · Retrying");
                    hls.startLoad();

                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {

                    setStatus("Recovering playback");
                    hls.recoverMediaError();

                } else {

                    setStatus("Stream unavailable");
                    hls.destroy();
                    hls = null;
                }
            });

        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {

            video.src = parsedURL.href;

            initializePlayer([0], false);
            setStatus("EPICPLYR · Ready");

        } else {

            setStatus("HLS not supported");
        }

    } else {

        video.src = parsedURL.href;

        initializePlayer([0], false);
        setStatus("EPICPLYR · MP4 Ready");
    }
}

// Read URL parameter
const params = new URLSearchParams(window.location.search);
const streamURL = params.get("url");

if (streamURL) {
    startPlayer(streamURL);
} else {
    setStatus("EPICPLYR · No stream URL");
}

// Cleanup
window.addEventListener("beforeunload", () => {
    if (hls) hls.destroy();
    if (player) player.destroy();
});

</script>

</body>
</html>
